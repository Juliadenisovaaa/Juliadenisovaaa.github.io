<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
    font-family: 'Montserrat', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .envelope-container {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  .card {
    background: #fff;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 400px;
    position: relative;
    z-index: 2;
    animation: popIn 1s cubic-bezier(0.19, 1, 0.22, 1) both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.8) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .heart-icon {
    font-size: 50px;
    color: #ff4d6d;
    animation: beat 1s infinite;
    display: inline-block;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 48px;
    color: #333;
    margin: 15px 0;
    line-height: 1.2;
  }
  p {
    font-size: 16px;
    color: #666;
    margin-bottom: 30px;
    line-height: 1.6;
  }
  .btn {
    padding: 15px 40px;
    font-size: 16px;
    color: #fff;
    background: #ff4d6d;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
    transition: all 0.3s;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
  }
  .btn:hover {
    background: #e6395b;
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 25px rgba(255, 77, 109, 0.5);
  }
  /* Падающие сердечки на фоне */
  .bg-heart {
    position: absolute;
    color: #ffb3c6;
    font-size: 20px;
    animation: float 6s linear infinite;
    z-index: 1;
  }
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="envelope-container" id="container">
  <div class="card">
    <div class="heart-icon">❤️</div>
    <h1>С Днём Рождения,<br>моя Лапуся!</h1>
    <p>Там какая-то открыточка. Нажми на кнопку ниже, чтобы открыть сюрприз...</p>
    <button class="btn" onclick="goToBirthday()">Открыть сюрприз 🎁</button>
  </div>
</div>

<script>
  // Создаем падающие сердечки
  const container = document.getElementById('container');
  setInterval(() => {
    const heart = document.createElement('div');
    heart.className = 'bg-heart';
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
    container.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 300);

  // Переход на вторую страницу
  function goToBirthday() {
    // Добавляем эффект плавного исчезновения перед переходом
    document.body.style.transition = 'opacity 1s ease';
    document.body.style.opacity = '0';
    setTimeout(() => {
      window.location.href = 'birthday.html'; // Переход
    }, 1000);
  }
</script>

</body>
</html>
